model_id: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
output_dir: "models/sft_checkpoint"
dataset_path: "data/processed/train.jsonl"
eval_dataset_path: "data/processed/val.jsonl"
max_seq_length: 1536
learning_rate: 0.0002
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 4
num_train_epochs: 3
warmup_ratio: 0.05
weight_decay: 0.01
logging_steps: 10
save_strategy: "steps"
save_steps: 100
save_total_limit: 2
fp16: false
bf16: true
seed: 42
use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"
